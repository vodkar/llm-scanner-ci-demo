name: llm-scanner

on:
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  SCANNER_REF: a8f4d491ad731af1823dd173275590a7e640b48b
  LLM_MODEL: google/gemma-4-E2B-it
  NEO4J_URI: bolt://localhost:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: scanner-ci

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/scanner-ci
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p scanner-ci 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install llm-scanner
        run: pip install "git+https://github.com/vodkar/llm_scanner@${SCANNER_REF}"

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Wait for LLM endpoint
        env:
          LLM_HOST: ${{ vars.LLM_HOST }}
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "http://${LLM_HOST}:8000/v1/models" && exit 0
            sleep 5
          done
          echo "::error::LLM endpoint http://${LLM_HOST}:8000 is unreachable over Tailscale"
          exit 1

      - name: Build PR diff
        run: |
          git diff "${{ github.event.pull_request.base.sha }}" HEAD -- '*.py' > pr.diff
          cat pr.diff

      - name: Scan changed code
        env:
          LLM_HOST: ${{ vars.LLM_HOST }}
        run: |
          llm-scanner scan . \
            --mode diff \
            --diff-file pr.diff \
            --llm-base-url "http://${LLM_HOST}:8000/v1" \
            --llm-model "${LLM_MODEL}" \
            --llm-concurrency 2 \
            --llm-structured-output \
            --llm-temperature 1.0 \
            --llm-top-p 0.95 \
            --llm-top-k 64 \
            --llm-min-p 0.01 \
            --llm-repetition-penalty 1.0 \
            --llm-self-consistency 3 \
            --llm-max-tokens 8192 \
            --llm-timeout 900 \
            --output-json llm-scanner-report.json \
            --output-sarif llm-scanner.sarif \
            --no-fail

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('llm-scanner.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: llm-scanner.sarif
          category: llm-scanner

      - name: Upload reports
        if: always() && hashFiles('llm-scanner-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: llm-scanner-report
          path: |
            llm-scanner-report.json
            llm-scanner.sarif
